name: Relay v3.5.10 installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Download, reassemble, and verify installer
        shell: bash
        run: |
          set -euo pipefail
          base="https://cuhkpclkiauqfzrhrzde.supabase.co/storage/v1/object/public/release-staging/v3.5.10"
          for i in 00 01 02 03 04 05; do
            curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 300 "$base/part${i}.bin" -o "part${i}.bin"
          done
          cat part00.bin part01.bin part02.bin part03.bin part04.bin part05.bin > AlphaQuantPro_Setup_3_5_10.exe
          test "$(stat -c%s AlphaQuantPro_Setup_3_5_10.exe)" = "269228273"
          echo "e40e8a3d9a1ea92542550eb50f0a8a4457fec4cfc91d78872356d5de8be6dcee  AlphaQuantPro_Setup_3_5_10.exe" | sha256sum -c -
      - name: Upload installer and publish release
        timeout-minutes: 30
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="AlphaQuantPro_Setup_3_5_10.exe"
          release_id="390934839"
          upload_url="https://uploads.github.com/repos/AlphaQuantPro/Alpha-Releases/releases/${release_id}/assets?name=${asset}"
          uploaded=0
          for attempt in 1 2 3 4; do
            echo "UPLOAD_ATTEMPT=${attempt}"
            existing_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/${release_id}/assets" --jq ".[] | select(.name==\"${asset}\") | .id" | head -n1 || true)"
            if [ -n "$existing_id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/${existing_id}"
            fi
            rm -f upload-response.json
            set +e
            http_code="$(curl --silent --show-error --http1.1 --connect-timeout 20 --max-time 900 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${asset}" \
              --output upload-response.json \
              --write-out "%{http_code}" \
              "${upload_url}")"
            rc=$?
            set -e
            echo "UPLOAD_RC=${rc} HTTP_CODE=${http_code}"
            if [ "$rc" -eq 0 ] && [ "$http_code" = "201" ] && jq -e '.state == "uploaded" and .size == 269228273' upload-response.json >/dev/null; then
              uploaded=1
              break
            fi
            cat upload-response.json || true
            sleep $((attempt * 5))
          done
          test "$uploaded" = "1"
          remote="$(gh api "repos/$GITHUB_REPOSITORY/releases/${release_id}/assets" --jq ".[] | select(.name==\"${asset}\") | [.state,.size,.digest] | @tsv")"
          echo "REMOTE_ASSET=${remote}"
          echo "$remote" | grep -F $'uploaded\t269228273\tsha256:e40e8a3d9a1ea92542550eb50f0a8a4457fec4cfc91d78872356d5de8be6dcee'
          gh release edit v3.5.10 --draft=false --latest --repo "$GITHUB_REPOSITORY"
          gh release view v3.5.10 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,publishedAt,assets