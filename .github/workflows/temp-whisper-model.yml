name: Temporary Whisper Model Fetch

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download base English Whisper model
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin \
            -o ggml-base.en-q5_1.bin
          sha256sum ggml-base.en-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-base-en-q5_1
          path: ggml-base.en-q5_1.bin
          compression-level: 0
          retention-days: 1
